; Better file sizes in Explorer details - Everything plugin settings
;
; Where this file is read from (first one that exists wins):
;   1. %LOCALAPPDATA%\BetterFileSizes\BetterFileSizes.ini
;   2. next to BetterFileSizes.dll
; Use (1) when the DLL lives in a folder you can't edit without admin rights,
; e.g. C:\Program Files\Everything\plugins\BetterFileSizes\.
;
; The Everything plugin notices when this file is saved and reloads
; automatically (hooks off everywhere, then on again).

[Settings]
; Show folder sizes:
;   everything   - via Everything (default)
;   disabled     - off
;   always       - calculated manually (can be slow)
;   withShiftKey - calculated manually, only while holding Shift
calculateFolderSizes=everything

; Mix files and folders when sorting by size (1 = yes, 0 = no)
sortSizesMixFolders=1

; File size units:
;   0        - Windows default
;   1        - MB/GB for large files
;   alwaysKb - always KB
disableKbOnlySizes=1

; Use IEC terms (KiB/MiB/GiB): 1 = yes, 0 = no
useIecTerms=0

[Process]
; Which processes get BetterFileSizes.dll (used by the Everything plugin):
;   smart     - (default) only normal desktop programs of the current user
;               that show a window; skips background processes, sandboxed /
;               low-integrity / AppContainer processes (browser tabs, UWP),
;               protected and elevated processes, other bitness, other
;               sessions, and a built-in list of games / launchers /
;               anti-cheat programs (EasyAntiCheat, BattlEye, Vanguard,
;               FACEIT, EA AC, ACE, Steam/Epic/Riot game folders, ...)
;   all       - every process that technically can be injected (like the
;               original Windhawk mod); only the hard exclude list applies
;   whitelist - only the processes listed in include=
mode=smart

; Patterns separated by |, wildcards * and ?. A pattern with a backslash
; matches the full path (e.g. *\Total Commander\*), otherwise the file name.
; include: always inject these (smart: bypasses the game list and the
;          "must have a window" rule; whitelist: the list itself).
; exclude: never inject these. Wins over everything else.
include=
exclude=

; smart mode only: inject when a window appears (window) or only once the
; process has also loaded windows.storage.dll (shell). "shell" injects into
; fewer programs, but the very first file dialog may show default sizes.
trigger=window

; smart mode only: 0 = don't use the built-in game / anti-cheat list
skipGames=1

; Safety-net rescan interval in seconds (0 = default: 30 in smart mode,
; 3 in all/whitelist mode, where windowless processes can only be found by
; scanning). New windows are detected instantly through window events.
scanInterval=0

[Host]
; What happens when the Everything plugin exits: 0 = (default) the programs
; that already have the mod keep it, like Windhawk; 1 = turn the hooks off
; in every program first.
; Turn it off from Everything's plugin page, or with disable=1 below.
; The DLL itself is never unloaded from a process
; once it is active (it only switches its hooks off) - this is what makes
; turning it off safe.
disableOnExit=0

; ---- Readiness gate (1.6.0.3) ----
; Nothing is injected right away. The host first waits until the system is
; quiet, then injects one program at a time (explorer.exe first).
; With calculateFolderSizes=everything and waitForEverything=1 it waits for:
;   Everything running -> its database loaded -> not busy -> Everything's own
;   disk I/O and CPU low + system disk mostly idle for idleSeconds in a row ->
;   a test folder-size query (C:\Windows) answering in < 500 ms.
; Other modes (or waitForEverything=0): startupDelay + the disk-idle window.
; If Everything restarts or reloads its database later, new injections pause
; until it is ready again (programs that already have the mod keep it).
; The gate starts when the Everything plugin starts.
waitForEverything=1
; seconds the system must stay quiet before injecting
idleSeconds=10
; system disk busy % (PDH "\PhysicalDisk(_Total)\% Idle Time") must be <= this
maxDiskBusyPercent=30
; Everything.exe read+write MB/s must be <= this
maxEverythingIoMBps=2
; Everything.exe CPU % (of all cores) must be <= this
maxEverythingCpuPercent=25
; give up waiting after this many seconds and inject anyway; 0 = wait forever
readyTimeout=0
; pause between two injections, in milliseconds
injectIntervalMs=200
; seconds to wait after the host starts (e.g. after logon), before checking
startupDelay=5

[Symbols]
; Symbol server used to download windows.storage.pdb (first run only).
; The address below is Microsoft's. In mainland China it is often slow.
; Same path layout, China mirror: http://msdl.blackint3.com:88/download/symbols
server=https://msdl.microsoft.com/download/symbols

[Debug]
; SAFETY VALVE: disable=1 makes the DLL do nothing when it is loaded, and the
; plugin stops injecting and switches the hooks off everywhere.
; Same effect: create an empty file named BetterFileSizes.disable next to
; BetterFileSizes.dll or in %LOCALAPPDATA%\BetterFileSizes\
disable=0

; verbose=1 logs every hook call (slow! only for debugging). By default only
; load/enable/disable events are logged.
verbose=0

; Optional log file (relative paths are next to the DLL). Logs also
; go to OutputDebugString, viewable with Sysinternals DebugView.
logFile=
